[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "promociones-b2b"
version = "1.0.0"
description = "Techo de descuento por segmento de clientes B2B, con datos sintéticos reproducibles"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = ["pytest>=7", "nbformat>=5", "nbclient>=0.9", "ipykernel>=6"]

[tool.setuptools]
packages = ["promociones"]

[tool.ruff]
line-length = 100

[tool.ruff.lint.isort]
known-first-party = ["promociones"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
